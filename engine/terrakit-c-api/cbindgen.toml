language = "C"
include_guard = "TERRAKIT_H"
cpp_compat = true
documentation = true
usize_is_size_t = true
autogen_warning = "/* Generated by cbindgen for TerraKit. Do not edit by hand. */"
after_includes = """
#ifndef TK_API
#  if defined(_WIN32) && defined(TK_BUILD_SHARED)
#    define TK_API __declspec(dllexport)
#  elif defined(_WIN32) && defined(TK_USE_SHARED)
#    define TK_API __declspec(dllimport)
#  else
#    define TK_API
#  endif
#endif
"""

[parse]
parse_deps = false

